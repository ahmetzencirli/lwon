# Publishes the lwon package to npm when a version tag (v1.2.3 or v1.2.3-beta.4) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in the repository.
# npm must list this repository, this file (publish.yml) and the "npm" environment
# as a trusted publisher for the package.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/lwon/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - run: npm run smoke --workspace lwon
      # npm needs an explicit tag for prereleases. Until a stable version exists, betas
      # go out as "latest" so `npm install lwon` gets the newest one; after that, as "beta".
      - name: Choose the dist-tag
        id: tag
        run: |
          version=$(node -p "require('./packages/lwon/package.json').version")
          tag=latest
          if [[ "$version" == *-* ]]; then
            stable=$(npm view lwon versions --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=s?[].concat(JSON.parse(s)):[];console.log(v.some(x=>!x.includes("-"))?"yes":"no")})')
            [ "$stable" = yes ] && tag=beta
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version with tag $tag"
      - run: npm publish --workspace lwon --provenance --access public --tag ${{ steps.tag.outputs.tag }}
