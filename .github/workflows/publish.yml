# Stages a release on npm when a version tag is pushed. The tag names the package:
#   v1.2.3, v1.2.3-beta.4        -> @lwon/core       (packages/lwon)
#   mcp-proxy-v0.1.0              -> @lwon/mcp-proxy  (packages/mcp-proxy)
# Uses npm trusted publishing (OIDC): no npm token is stored in the repository. The trusted
# publisher allows staging only, so nothing is installable until a maintainer approves the
# staged version on npmjs.com (Staged Packages) or with `npm stage approve`, using 2FA.
# Each package must list this repository, this file (publish.yml) and the "npm" environment
# as its trusted publisher.
name: Stage npm release

on:
  push:
    tags: ['v*', 'mcp-proxy-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; `npm stage` needs 11.15.0.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - name: Find the package for this tag
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            mcp-proxy-v*) dir=packages/mcp-proxy; tagged=${GITHUB_REF_NAME#mcp-proxy-v} ;;
            v*)           dir=packages/lwon;      tagged=${GITHUB_REF_NAME#v} ;;
            *) echo "Unknown tag $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          if [ "$tagged" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $name $version" >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $name $version from $dir"
      - run: npm run build
      - run: npm test
      - run: npm run smoke --workspace ${{ steps.pkg.outputs.dir }}
      # npm needs an explicit tag for prereleases. Until a stable version exists, prereleases
      # go out as "latest" so `npm install` gets the newest one; after that, as "beta".
      - name: Choose the dist-tag
        id: tag
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          tag=latest
          if [[ "$VERSION" == *-* ]]; then
            stable=$(npm view "$NAME" versions --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v=[];try{v=[].concat(JSON.parse(s)).filter(x=>typeof x==="string")}catch{}console.log(v.some(x=>!x.includes("-"))?"yes":"no")})')
            if [ "$stable" = yes ]; then tag=beta; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME $VERSION with tag $tag"
      # `npm stage` does not handle workspaces, so it runs inside the package folder.
      - name: Stage the release on npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm stage publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}
      - name: Next step
        run: echo "Staged ${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}. Approve it with 2FA on npmjs.com under Staged Packages, or run 'npm stage list' and 'npm stage approve <id>'." >> "$GITHUB_STEP_SUMMARY"
