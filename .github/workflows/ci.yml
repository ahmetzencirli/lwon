name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The MCP proxy imports @lwon/core from its build, so build before checking types.
      - run: npm run build
      - run: npm run typecheck --workspace packages/lwon
      - run: npm run typecheck --workspace packages/mcp-proxy
      - run: npm test

  compat:
    name: Built package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke --workspace packages/lwon
      - run: npm run smoke --workspace packages/mcp-proxy
